<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnapContext · Centro de Control Interactivo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.1/min/vs/editor/editor.main.min.css">
<style>
  :root { --fondo:#0d1117; --panel:#161b22; --borde:#30363d; --texto:#c9d1d9;
          --amarillo:#d29922; --azul:#58a6ff; --verde:#3fb950; --rojo:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--fondo);
         color:var(--texto); display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--borde);
           display:flex; align-items:center; gap:14px; }
  header h1 { font-size:16px; margin:0; }
  #estado-agente { font-size:13px; padding:3px 10px; border-radius:12px;
                   background:#1f6feb33; border:1px solid var(--azul); }
  #meta { font-size:12px; opacity:.75; margin-left:auto; }
  main { flex:1; display:flex; min-height:0; }
  #col-timeline { flex:1.4; overflow-y:auto; padding:12px 16px; }
  #col-panel { flex:1; border-left:1px solid var(--borde); display:flex;
               flex-direction:column; min-width:280px; }
  #logs { flex:1; overflow-y:auto; padding:8px 12px; font-family:Consolas,monospace;
          font-size:12px; background:var(--panel); }
  .log-info { color:var(--texto); } .log-warning { color:var(--amarillo); }
  .log-error { color:var(--rojo); }
  .paso { border:1px solid var(--borde); border-left:4px solid var(--borde);
          border-radius:8px; margin:8px 0; padding:8px 12px; background:var(--panel); }
  .paso.pensamiento { border-left-color:var(--amarillo); }
  .paso.accion { border-left-color:var(--azul); }
  .paso.observacion { border-left-color:var(--verde); }
  .paso.error { border-left-color:var(--rojo); }
  .paso h3 { margin:0 0 4px; font-size:13px; display:flex; gap:8px; }
  .paso .tiempo { font-size:11px; opacity:.65; font-weight:normal; margin-left:auto; }
  .paso pre { white-space:pre-wrap; font-size:12px; margin:4px 0; }
  .paso .detalles { display:none; }
  .paso.expandido .detalles { display:block; }
  .paso.expander { cursor:pointer; user-select:none; }
  /* Modal diff */
  #modal-diff { display:none; position:fixed; inset:0; background:#0009;
                z-index:50; align-items:center; justify-content:center; }
  #modal-diff.abierto { display:flex; }
  #modal-caja { background:var(--panel); border:1px solid var(--borde);
                border-radius:10px; width:min(1100px,94vw); height:88vh;
                display:flex; flex-direction:column; }
  #modal-caja .cabecera { padding:10px 14px; display:flex; gap:10px; align-items:center; }
  #modal-caja .cabecera h2 { font-size:14px; margin:0; flex:1; }
  #contenedor-diff { flex:1; }
  #modal-caja .pie { padding:10px 14px; display:flex; gap:10px; justify-content:flex-end; }
  button { background:#21262d; color:var(--texto); border:1px solid var(--borde);
           border-radius:6px; padding:6px 14px; cursor:pointer; font-size:13px; }
  button.primario { background:#238636; border-color:#2ea043; }
  button.peligro { background:#b62324; border-color:#da3633; }
  button:hover { filter:brightness(1.2); }
  #sin-conexion { color:var(--rojo); font-size:12px; display:none; }
</style>
</head>
<body>
<header>
  <h1>🛠 SnapContext · Centro de Control Interactivo</h1>
  <span id="estado-agente">Esperando…</span>
  <span id="meta">Pasos: <b id="contador-pasos">0</b> · ⏱ <span id="tiempo-total">0s</span></span>
  <span id="sin-conexion">● sin conexión</span>
</header>
<main>
  <section id="col-timeline"><h2 style="font-size:13px;opacity:.7">Timeline ReAct</h2><div id="timeline"></div></section>
  <aside id="col-panel">
    <h2 style="font-size:13px;opacity:.7;padding:10px 12px 0">Logs estructurados</h2>
    <div id="logs"></div>
  </aside>
</main>
<div id="modal-diff">
  <div id="modal-caja">
    <div class="cabecera">
      <h2>🔀 Conflicto de parche: <span id="diff-ruta"></span></h2>
      <button id="btn-lineas">✂️ Aceptar líneas seleccionadas</button>
    </div>
    <div id="contenedor-diff"></div>
    <div class="pie">
      <button class="peligro" id="btn-rechazar">✖ Rechazar todo</button>
      <button class="primario" id="btn-aceptar">✔ Aceptar todo</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.1/min/vs/loader.js"></script>
<script src="/static/interactive.js"></script>
</body>
</html>
