[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snapcontext"
version = "6.35.0"
description = "SnapContext: asistente de IA con contexto automático para desarrollo."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSE.MIT"]
authors = [
    {name = "NicolÃ¡s Bruna", email = "nicolasbruna24@gmail.com"}
]
keywords = ["ai", "assistant", "coding", "development", "ollama", "gemini", "claude", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "google-generativeai>=0.8.3",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=12.0",
]
browser = [
    "playwright>=1.40.0",
]
dev = [
    # Herramientas de calidad (Fase 10): pip install -e ".[dev]"
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "pytest-cov>=5.0.0",
]
db = [
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
]
tui = [
    "textual>=0.50.0",
]
xpu = [
    # Fase 18: ipex-llm>=2.2.0 es la primera versión con soporte estable de
    # la serie B (Battlemage, p. ej. Arc B70). Ruta preferida de carga.
    "torch>=2.5.0",
    "intel-extension-for-pytorch>=2.5.0",
    "ipex-llm[cpp]>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
]
all = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=12.0",
    "playwright>=1.40.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "textual>=0.50.0",
    "torch>=2.5.0",
    "intel-extension-for-pytorch>=2.5.0",
    "ipex-llm[cpp]>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
]

[project.scripts]
snapcontext = "snapcontext:main"

[tool.setuptools]
py-modules = [
    "snapcontext", "agentes", "orquestador", "ui", "react_agent",
    "curador_proactivo", "telegram_gateway", "discord_gateway",
    "detector_tests", "sandbox_utils", "graph_rag", "parser_universal",
    "multi_agent", "context_utils", "skill_abstraction", "mcp_tools_db",
    "mcp_tools_api", "mcp_tools_browser", "github_gateway", "task_queue",
    "sub_agent", "sub_agent_prompts", "parallel_executor", "marketplace",
    "hooks", "model_router", "prompt_cache", "context_pruner",
    "graph_lsp_integrator", "backend_xpu",
    # v6.34.1: fix crÃ­tico â€” mÃ³dulos faltantes que el cÃ³digo importa en
    # tiempo de ejecuciÃ³n (--sandbox-session, --tui, --lsp, --multi-agent).
    # v6.34.5: asesor de seguridad/rendimiento extraído del monolito.
    "sandbox_session", "tui_hub", "tui_app", "lsp_client",
    "qa_tester_logic", "session_manager", "memory_store",
    "tui_interactiva", "autocorrector", "seguridad",
    "instalador",
    # Fase 3: capa de presentación (UI/colores/banners) extraída del monolito.
    "presentacion",
    # Fase 4: asistente de configuración inicial y proveedores de IA.
    "configuracion",
    # Fase 5: planificador y visualización de planes (v6.35.0).
    "planificador",
    # Fase 6: subsistema de permisos y confirmaciones del usuario (Fase 6).
    "permisos",
    # Fase 2: bloques extraídos del monolito (utilidades, edición,
    # diagnóstico/reparación/benchmark y estado global de procesos).
    "utils", "editor", "diagnostico", "estado",
    # Fase 4 (v6.34.16): modo demo para onboarding zero-config.
    "demo",
    # Fase 8: subsistema de herramientas MCP (dispatcher y registro).
    "mcp_tools",
    # Fase 3 (v6.34.15): cliente MCP estándar para servidores externos.
    "mcp_client",
]
packages = ["web"]

[tool.setuptools.package-data]
web = ["static/*", "static/**/*"]

# --- Fase 10: herramientas de calidad (A3 de la auditoría) ------------------

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    "build",
    "dist",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    "benchmarks/tasks/",  # Tareas con bugs intencionados (input.py)
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise from None
    "RUF012", # mutable class attributes
    "RUF001", # ambiguous-unicode: falsos positivos con texto español/emojis
    "RUF002", # idem en docstrings
    "RUF003", # idem en comentarios
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# snapcontext.py actúa como fachada de compatibilidad: re-exporta símbolos de
# los módulos extraídos (planificador, permisos, hooks, mcp_tools, etc.) para
# la API interna y los tests, con imports retardados (E402) y sin uso local
# (F401). Supresión documentada hasta retirar la fachada (fase posterior).
"snapcontext.py" = ["F401", "E402"]
# planificador.py: import retardado de snapcontext (evita ciclo; resuelve en
# tiempo de llamada para respetar el monkey-patching de los tests).
"planificador.py" = ["E402"]
# tests/ y scripts/: ajustan sys.path antes de importar (patrón estándar).
# Además, los checks de estilo no se aplican a los tests (RUF059 unpacking
# parcial, C408, UP031, B905, RUF005, F841, E741, C416, F401). El F811
# (clases de test duplicadas en test_context_pruner.py) queda documentado
# para revisión en la fase 10d: puede ocultar tests.
"tests/*" = [
    "E402",
    "RUF059",
    "C408",
    "UP031",
    "B905",
    "RUF005",
    "F841",
    "E741",
    "C416",
    "F401",
    "F811",
    "RUF007",
    "RUF015",
]
"scripts/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false   # inicialmente false para no bloquear
ignore_missing_imports = true
# mypy espera expresiones regulares (no globs) en exclude.
exclude = [
    "^build/",
    "^dist/",
    "^\\.venv/",
    "__pycache__",
    "egg-info",
    "^tests/",
    "benchmarks/tasks/",
    "^benchmarks/",  # Runner y tareas (no son parte del paquete)
]

[[tool.mypy.overrides]]
module = "snapcontext"
ignore_errors = true   # temporal, para no bloquear el CI

[[tool.mypy.overrides]]
module = "mcp_client"
ignore_errors = true   # problemas de tipos con IO[Any] | None (union-attr)

[[tool.mypy.overrides]]
module = "demo"
ignore_errors = true   # Returning Any from function declared to return "bool"

[[tool.mypy.overrides]]
module = "github_gateway"
ignore_errors = true   # Returning Any from function declared to return "str | None"

[[tool.mypy.overrides]]
module = "curador_proactivo"
ignore_errors = true   # Returning Any from function declared to return "bool"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Fase 1 (10b): se mide cobertura por defecto. Requiere pytest-cov: ya está en
# el extra "dev" y se instala en TODOS los jobs de pytest del CI. El umbral duro
# (--cov-fail-under) se aplica de forma explícita por gate: la línea base actual
# del monolito es ~9-20%, por lo que el gate de smoke empieza en COV_MIN (~10%,
# ver variable en `.github/workflows/python-package.yml`) y se subirá hacia
# 50% -> 60% conforme crezca la cobertura del núcleo (flujo_principal,
# orquestador, motor de edición).
addopts = "-v --maxfail=3 --cov --cov-report=term"

[tool.coverage.run]
# Fase 1/2: núcleo agéntico + módulos extraídos del monolito (Fase 2).
# Los módulos extraídos (utils, editor, diagnostico, estado) siguen siendo parte
# del proyecto y deben medirse para que el gate de cobertura refleje el todo.
source = ["snapcontext", "planificador", "permisos", "hooks", "mcp_tools",
          "configuracion", "presentacion", "seguridad", "instalador",
          "agentes", "orquestador", "react_agent",
          "utils", "editor", "diagnostico", "estado"]
omit = ["tests/*", "build/*", "dist/*"]

[tool.coverage.report]
fail_under = 43   # TODO: subir a 50 cuando la cobertura real del gate lo alcance
