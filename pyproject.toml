[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snapcontext"
version = "6.28.0"
description = "SnapContext: asistente de IA con contexto automático para desarrollo."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Nicolás Bruna", email = "nicolasbruna24@gmail.com"}
]
keywords = ["ai", "assistant", "coding", "development", "ollama", "gemini", "claude", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "google-generativeai>=0.8.3",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=12.0",
]
browser = [
    "playwright>=1.40.0",
]
db = [
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
]
tui = [
    "textual>=0.50.0",
]
all = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=12.0",
    "playwright>=1.40.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "textual>=0.50.0",
]

[project.scripts]
snapcontext = "snapcontext:main"

[tool.setuptools]
py-modules = [
    "snapcontext", "agentes", "orquestador", "ui", "react_agent",
    "curador_proactivo", "telegram_gateway", "discord_gateway",
    "detector_tests", "sandbox_utils", "graph_rag", "parser_universal",
    "multi_agent", "context_utils", "skill_abstraction", "mcp_tools_db",
    "mcp_tools_api", "mcp_tools_browser", "github_gateway", "task_queue",
    "sub_agent", "sub_agent_prompts", "parallel_executor", "marketplace",
    "hooks", "model_router"
]
packages = ["web"]

[tool.setuptools.package-data]
web = ["static/*", "static/**/*"]
