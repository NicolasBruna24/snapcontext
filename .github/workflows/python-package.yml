# CI/CD para el paquete Python de SnapContext.
#
# 1. Ejecuta los tests en cada push/PR a main (Python 3.10–3.13).
# 2. Verifica de forma ESTRICTA que el wheel contiene todos los módulos
#    críticos, evitando el bug de empaquetado C1 (módulos faltantes).
# 3. Publica en PyPI (trusted publishing) al crear un tag v*.*.*.
name: python-package

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Umbral mínimo de cobertura para el GATE BLOQUEANTE de smoke (Fase 1).
  # Línea base realista: la cobertura total actual del monolito es ~9-20%
  # (consulta docs/AUDIT_COMPETITIVA.md#4), así que empezar en 50% rompería el
  # CI. Arranca en 10% y se sube hacia 50% -> 60% en fases 1b/2.
  COV_MIN: '10'

jobs:
  build-and-test:
    name: Build & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov build twine
          # Instalación BASE (sin extras): los extras (web, browser, db, tui, xpu)
          # arrastran dependencias pesadas (textual, playwright, tree-sitter,
          # torch/ipex) que consumen demasiada RAM en runners gratuitos (~7 GB)
          # y provocan OOM killer (exit 137) al ejecutar la suite completa.
          pip install -e .

      - name: Smoke tests + cobertura (gate bloqueante)
        # Fase 1: los smoke tests son el gate DIFÍCIL de cobertura para publicar.
        # addopts (pyproject.toml) aporta --cov --cov-report=term; aquí se
        # impone el umbral mínimo COV_MIN. La suite completa supera la memoria
        # de los runners gratuitos, por eso aquí solo se corren los smoke tests.
        run: pytest tests/test_import.py -q --maxfail=3 --cov-fail-under=${{ env.COV_MIN }}

      - name: Build wheel and sdist
        run: python -m build

      - name: List wheel contents
        run: unzip -l dist/*.whl

      - name: Verify wheel contains all critical modules
        # Verificación estricta: si falta alguno de estos módulos, el job
        # falla y bloquea tanto la merge como la publicación.
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"Se esperaba 1 wheel, hay {len(wheels)}: {wheels}"

          names = zipfile.ZipFile(wheels[0]).namelist()
          criticos = [
              "sandbox_session", "tui_hub", "tui_app", "lsp_client",
              "qa_tester_logic", "session_manager", "memory_store",
              "tui_interactiva", "autocorrector",
          ]
          faltantes = [m for m in criticos if f"{m}.py" not in names]
          if faltantes:
              print("FALTAN MODULOS EN EL WHEEL:", faltantes)
              sys.exit(1)
          print("OK: todos los módulos críticos están presentes en el wheel.")
          PY

      - name: Validate package with twine
        run: python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}
          path: dist/
          retention-days: 1

  quality:
    name: Quality gates (ruff / mypy)
    runs-on: ubuntu-latest
    # Fase 1 (10b): los quality gates pasan a ser BLOQUEANTES. Se elimina
    # continue-on-error para que ruff y mypy fallen el merge si hay errores.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest-cov
          pip install -e .

      - name: Ruff (lint)
        run: python -m ruff check . --statistics

      - name: Ruff (format check)
        run: python -m ruff format . --check

      - name: Mypy (type check)
        run: python -m mypy .
      # (Fase 1) El gate de cobertura con umbral se ejecuta en `build-and-test`
      # (smoke tests). Aquí solo se ejecutan linters que ahora BLOQUEAN.

  integration-tests:
    name: Integration tests (suite completa, no bloqueante)
    runs-on: ubuntu-latest
    # Fase 1: la suite completa revienta por memoria (OOM) en runners gratuitos
    # (~7 GB) y arrastra deps pesadas (textual, playwright, torch). Se ejecuta en
    # un job SEPARADO y NO bloqueante por ahora: continue-on-error reporta el
    # resultado sin impedir merges/publicaciones mientras la suite no sea estable.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e .

      - name: Run full test suite
        # addopts (pyproject) aporta --cov; si supera la memoria (exit 137) el job
        # NO bloquea por continue-on-error, pero queda registrado en los checks.
        run: pytest tests/ -q --maxfail=5

  publish-pypi:
    name: Publish to PyPI
    needs: [build-and-test, quality]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/snapcontext/
    permissions:
      # Necesario para trusted publishing (OIDC a PyPI). NO requiere token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/