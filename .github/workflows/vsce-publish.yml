# Publicación de la extensión de VS Code al Marketplace al crear un tag v*.*.*.
#
# Reactivado en v6.34.14 (Fase 19): `vscode/LICENSE` y `vscode/.vscodeignore`
# ya existen. Requiere el secreto `VSCE_PAT` (Personal Access Token del
# Marketplace de VS Code con scope Marketplace:Manage).
#
# Ejecución manual opcional: pestaña Actions → vsce-publish → Run workflow.
name: vsce-publish

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # B9.63-B — GATE DE INTEGRIDAD DE RELEASE (fail-closed). Mismo script que en
  # `python-package.yml`; `needs` no cruza ficheros de workflow, así que el gate
  # debe existir también aquí para que `publish-vscode` quede bloqueado si el
  # contrato de release se rompe. No publica nada.
  verify-release:
    name: Verify release integrity (I1-I12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Verify release contract (I1-I12, fail-closed)
        run: |
          TAG=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            echo "Verificando release candidate: $TAG"
          else
            echo "Sin tag: se omiten los invariantes que dependen del tag (I1)."
          fi
          if [ -n "$TAG" ]; then
            python scripts/verify_release.py --tag "$TAG"
          else
            python scripts/verify_release.py --allow-no-tag \
              --only I2 I3 I4 I5 I6 I7 I8 I9 I10 I11 I12
          fi

  publish-vscode:
    name: Publish VS Code extension
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        run: |
          cd vscode
          npm ci

      - name: Compile extension
        run: |
          cd vscode
          npm run compile

      - name: Package extension
        run: |
          cd vscode
          npx @vscode/vsce package -o snapcontext-ai.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapcontext-ai-vsix
          path: vscode/snapcontext-ai.vsix
          retention-days: 7

      - name: Publish to VS Code Marketplace
        # Si el secreto no está configurado, el empaquetado (.vsix) igual se
        # sube como artifact y la publicación se hace manualmente después.
        # Nota: `secrets` no está permitido en `if`; se pasa por `env`.
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          cd vscode
          npx @vscode/vsce publish \
            --packagePath ./snapcontext-ai.vsix \
            -p "$VSCE_PAT"