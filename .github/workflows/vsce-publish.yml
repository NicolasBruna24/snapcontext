# Publicación de la extensión de VS Code al Marketplace al crear un tag v*.*.*.
#
# Requiere el secreto `VSCE_PAT` configurado en el repositorio (Personal
# Access Token del marketplace de Visual Studio Code).
name: vsce-publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish-vscode:
    name: Publish VS Code extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        run: |
          cd vscode
          npm ci

      - name: Compile extension
        run: |
          cd vscode
          npm run compile

      - name: Package extension
        run: |
          cd vscode
          npx @vscode/vsce package -o snapcontext-ai.vsix

      - name: Publish to VS Code Marketplace
        run: |
          cd vscode
          npx @vscode/vsce publish \
            --packagePath ./snapcontext-ai.vsix \
            -p ${{ secrets.VSCE_PAT }}