# Publicación de la extensión de VS Code al Marketplace al crear un tag v*.*.*.
#
# ⚠️ DESHABILITADO TEMPORALMENTE (v6.34.4): falla por falta de `LICENSE` y
# `.vscodeignore` en `vscode/`. No es crítico para publicar en PyPI.
# Para reactivarlo:
#   1. Añadir `vscode/LICENSE` y `vscode/.vscodeignore`.
#   2. Configurar el secreto `VSCE_PAT`.
#   3. Restaurar el trigger `push: tags: ['v*.*.*']` y quitar `if: false`
#      del job `publish-vscode`.
#
# Requiere el secreto `VSCE_PAT` configurado en el repositorio (Personal
# Access Token del marketplace de Visual Studio Code).
name: vsce-publish

on:
  # Deshabilitado el trigger por tag; solo ejecución manual desde la pestaña
  # Actions mientras dure la deshabilitación.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-vscode:
    name: Publish VS Code extension
    # Doble seguro: el job nunca se ejecuta hasta reactivarlo.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        run: |
          cd vscode
          npm ci

      - name: Compile extension
        run: |
          cd vscode
          npm run compile

      - name: Package extension
        run: |
          cd vscode
          npx @vscode/vsce package -o snapcontext-ai.vsix

      - name: Publish to VS Code Marketplace
        run: |
          cd vscode
          npx @vscode/vsce publish \
            --packagePath ./snapcontext-ai.vsix \
            -p ${{ secrets.VSCE_PAT }}