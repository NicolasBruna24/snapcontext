# Despliegue de la landing page en GitHub Pages al pushear a main (Fase 19).
name: pages-deploy

on:
  push:
    branches: [main]
    paths: ['docs/landing/**', '.github/workflows/pages-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy landing to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4